<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page not found · Priyanka Jha</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Caveat:wght@600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(700px 420px at 50% 62%, rgba(233, 180, 76, .12), transparent 65%),
        linear-gradient(#1c0f22, #251331 60%, #1c0f22);
      color: #f6ecdd;
      font-family: "Fraunces", Georgia, serif;
      text-align: center;
      padding: 24px;
    }
    .page { max-width: 560px; }
    .num {
      font-size: clamp(90px, 22vw, 160px);
      font-weight: 600;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 2.5px #e9b44c;
    }
    .hand {
      font-family: "Caveat", cursive;
      font-size: clamp(26px, 5vw, 34px);
      color: #f6ecdd;
      margin: 18px 0 6px;
      transform: rotate(-1.5deg);
    }
    .es {
      font-family: "Caveat", cursive;
      font-size: 22px;
      color: #bfa6cb;
      margin-bottom: 34px;
      transform: rotate(-1.5deg);
    }
    .back {
      display: inline-block;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      letter-spacing: .12em;
      color: #2a1420;
      background: #e9b44c;
      text-decoration: none;
      padding: 13px 26px;
      border-radius: 999px;
      box-shadow: 0 6px 24px rgba(233, 180, 76, .25);
      transition: transform .2s;
    }
    .back:hover { transform: translateY(-2px); }
    .mark {
      margin-top: 46px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: .22em;
      color: #8f7a9c;
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="num">404</p>
    <p class="hand">This page isn't in her story… yet.</p>
    <p class="es">Esta página aún no está en su historia.</p>
    <a class="back" href="/">← BACK TO CHAPTER ONE</a>
    <p class="mark">PRIYANKA JHA · ENGLISH LANGUAGE TEACHER</p>
  </main>
</body>
</html>
